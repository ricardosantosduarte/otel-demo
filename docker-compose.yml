services:
  # Grafana + Tempo (traces) + Loki (logs) + Prometheus (metrics) + a bundled
  # OpenTelemetry Collector, all in one image. The browser and the Node services
  # ship OTLP straight here; the image's collector already has CORS enabled and
  # routes each signal to the right backend.
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    ports:
      - "3000:3000" # Grafana UI
      - "4318:4318" # OTLP HTTP (browser + services)
      - "4317:4317" # OTLP gRPC
    environment:
      - ENABLE_LOGS_ALL=true
    volumes:
      # Provision the dashboard from a file so it survives container recreation.
      - ./grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/otel-tryout.yaml:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/otel-tryout.json:ro
